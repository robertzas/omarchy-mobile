# SPDX-License-Identifier: MIT
# The Edge TPU driver loads exactly once per boot, from omamobile-tpu.service:
# a second load oopses in edgetpu_mmu_attach, and the probe needs the Trusty
# GSA hwmgr. A blacklist stops udev's autoload from racing the unit; an
# explicit modprobe (the unit's) still loads it.
blacklist janeiro
